# Параметры депозитов на биржу
[functions_params.deposit_params]
# если эта настройка true, то вне зависимости от того были свапы до этого или нет,
# сначала попытается отправить USDC, затем ETH
deposit_usdc = true

# можно не менять, если отправляем весь USDC
usdc_deposit_amounts = ["100", "100"]

eth_deposit_amounts = ["80", "95"]
